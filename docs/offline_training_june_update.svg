<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="560" viewBox="0 0 2100 560">
  <defs>
    <style>
      .title { font: 700 24px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #111; }
      .label { font: 700 18px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #111; }
      .body { font: 600 16px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #111; }
      .small { font: 600 15px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #7f3b08; }
      .foot { font: 600 18px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #7f6000; }
      .shadow { filter: drop-shadow(0 6px 10px rgba(0,0,0,0.12)); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#4d7cc9"/>
    </marker>
  </defs>

  <rect x="20" y="20" rx="42" ry="42" width="2060" height="500" fill="#fbfbfb" stroke="#b7b7b7" stroke-width="2" class="shadow"/>

  <text x="80" y="78" class="title">离线训练阶段：学习 GNN 编码器、子网聚合和评分头参数；不训练硬规则和 Beam Search</text>

  <rect x="1600" y="45" rx="12" ry="12" width="320" height="42" fill="#fff2cc" stroke="#d79b00" stroke-width="2"/>
  <text x="1760" y="72" text-anchor="middle" class="label" fill="#7f6000">6月新增：模拟测试数据集构建 + 实验验证</text>

  <line x1="305" y1="222" x2="365" y2="222" stroke="#4d7cc9" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="615" y1="222" x2="675" y2="222" stroke="#4d7cc9" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="940" y1="222" x2="1015" y2="222" stroke="#4d7cc9" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1290" y1="222" x2="1375" y2="222" stroke="#4d7cc9" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1585" y1="222" x2="1675" y2="222" stroke="#4d7cc9" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="55" y="165" rx="18" ry="18" width="250" height="115" fill="#e7d8ea" stroke="#8e6f95" stroke-width="3" class="shadow"/>
  <text x="180" y="198" text-anchor="middle" class="label">训练样本构造</text>
  <text x="180" y="224" text-anchor="middle" class="body">(qt, Gk, yk)</text>
  <text x="180" y="248" text-anchor="middle" class="body">历史运行 / 仿真 / 专家调度</text>

  <rect x="365" y="165" rx="18" ry="18" width="250" height="115" fill="#d9ead3" stroke="#6a9c5e" stroke-width="3" class="shadow"/>
  <text x="490" y="198" text-anchor="middle" class="label">标签形式</text>
  <text x="490" y="224" text-anchor="middle" class="body">排序标签 / 执行时间 / 加速比</text>
  <text x="490" y="248" text-anchor="middle" class="body">/ QoS满足</text>

  <rect x="675" y="165" rx="18" ry="18" width="265" height="115" fill="#dae8fc" stroke="#3c78c5" stroke-width="3" class="shadow"/>
  <text x="807.5" y="198" text-anchor="middle" class="label">前向计算</text>
  <text x="807.5" y="224" text-anchor="middle" class="body">GNN编码 + Readout + 评分头</text>
  <text x="807.5" y="248" text-anchor="middle" class="body">预测 score(qt, Gk)</text>

  <rect x="1015" y="165" rx="18" ry="18" width="275" height="115" fill="#f9dfd0" stroke="#d79b69" stroke-width="3" class="shadow"/>
  <text x="1152.5" y="198" text-anchor="middle" class="label">损失函数</text>
  <text x="1152.5" y="224" text-anchor="middle" class="body">Lscore + Lrank + Lconstraint</text>
  <text x="1152.5" y="248" text-anchor="middle" class="body">优子网分数 &gt; 差子网分数</text>

  <rect x="1375" y="165" rx="18" ry="18" width="210" height="115" fill="#f9dfd0" stroke="#d79b69" stroke-width="3" class="shadow"/>
  <text x="1480" y="205" text-anchor="middle" class="label">反向传播</text>
  <text x="1480" y="235" text-anchor="middle" class="body">更新可训练参数</text>

  <text x="1330" y="128" text-anchor="middle" class="label">训练后部署参数</text>

  <rect x="1675" y="150" rx="20" ry="20" width="280" height="145" fill="#fff2cc" stroke="#d6a100" stroke-width="3" class="shadow"/>
  <text x="1815" y="188" text-anchor="middle" class="label">学习的参数</text>
  <text x="1815" y="216" text-anchor="middle" class="body">特征映射层 / Wr关系矩阵</text>
  <text x="1815" y="242" text-anchor="middle" class="body">注意力权重 / Readout / MLP</text>
  <text x="1815" y="268" text-anchor="middle" class="body">评分头</text>

  <path d="M675 335 h400 v92 h-382 l-18 -18 v-74 z" fill="#fff2cc" stroke="#d6a100" stroke-width="2"/>
  <path d="M1057 335 l18 18 h-18 z" fill="#f4d57c" stroke="#d6a100" stroke-width="2"/>
  <text x="875" y="366" text-anchor="middle" class="label">不参与训练</text>
  <text x="875" y="392" text-anchor="middle" class="body">硬约束过滤、Beam Search、调度前状态确认</text>
  <text x="875" y="416" text-anchor="middle" class="body">这些是算法规则或系统逻辑</text>

  <rect x="80" y="295" rx="12" ry="12" width="200" height="66" fill="#ffe6cc" stroke="#e67e22" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="180" y="321" text-anchor="middle" class="small">6月重点</text>
  <text x="180" y="345" text-anchor="middle" class="small">初步模拟数据集构建</text>
  <line x1="180" y1="295" x2="180" y2="280" stroke="#e67e22" stroke-width="2" stroke-dasharray="6 4"/>

  <rect x="390" y="295" rx="12" ry="12" width="200" height="66" fill="#ffe6cc" stroke="#e67e22" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="490" y="321" text-anchor="middle" class="small">6月重点</text>
  <text x="490" y="345" text-anchor="middle" class="small">测试集与标签设计</text>
  <line x1="490" y1="295" x2="490" y2="280" stroke="#e67e22" stroke-width="2" stroke-dasharray="6 4"/>

  <rect x="1125" y="315" rx="12" ry="12" width="220" height="66" fill="#ffe6cc" stroke="#e67e22" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1235" y="341" text-anchor="middle" class="small">当前进展</text>
  <text x="1235" y="365" text-anchor="middle" class="small">实验运行 / 效果验证</text>
  <line x1="1235" y1="315" x2="1235" y2="280" stroke="#e67e22" stroke-width="2" stroke-dasharray="6 4"/>

  <text x="80" y="475" class="foot">建议汇报口径：6月聚焦初步模拟数据集、测试数据集构建，并已进入训练实验与效果验证阶段</text>
</svg>
