version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: semi-real-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/resource_graph
      POSTGRES_URL: postgresql+psycopg://postgres:postgres@postgres:5432/resource_graph
      NEO4J_ENABLED: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password123
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - neo4j
      - redis

  postgres:
    image: postgres:16
    container_name: semi-real-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: resource_graph
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5.20
    container_name: semi-real-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/password123
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  redis:
    image: redis:7
    container_name: semi-real-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  neo4j_data:
