seed: 42
hidden_dim: 128
num_layers: 2
num_heads: 4
dropout: 0.2
lr: 0.001
weight_decay: 0.0001
batch_size: 64
epochs: 50
lambda_rank: 0.5
lambda_constraint: 0.1
margin: 0.2
top_k: 5
max_candidates: 20
device: "cuda_if_available"
paths:
  resources: "data/raw/resources.json"
  edges: "data/raw/edges.json"
  tasks: "data/raw/tasks.json"
  candidates: "data/processed/candidates.json"
  labels: "data/processed/labels.json"
  splits: "data/processed/splits.json"
  checkpoint: "outputs/checkpoints/best_model.pt"
  topk_results: "outputs/topk_results.json"
  evaluation: "outputs/evaluation.json"
  evaluation_report: "outputs/evaluation_report.html"
